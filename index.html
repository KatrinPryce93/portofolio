    <!-- =========================
         LANGUAGE SWITCH
    ========================== -->

    <script>

        const daButton = document.getElementById("da-btn");
        const enButton = document.getElementById("en-btn");

        const servicesImage =
            document.getElementById("services-image");


        function changeLanguage(language) {

            document.documentElement.lang = language;


            /* CHANGE NORMAL TEXT */

            document.querySelectorAll("[data-da]").forEach(element => {

                element.textContent =
                    element.dataset[language];

            });


            /* CHANGE SERVICES IMAGE */

            if (language === "da") {

                servicesImage.src =
                    "img/dk/services.da.png";

                daButton.classList.add("active");
                enButton.classList.remove("active");

            }

            else {

                servicesImage.src =
                    "img/en/services.en.png";

                enButton.classList.add("active");
                daButton.classList.remove("active");

            }

        }


        daButton.addEventListener("click", () => {
            changeLanguage("da");
        });


        enButton.addEventListener("click", () => {
            changeLanguage("en");
        });

    </script>
